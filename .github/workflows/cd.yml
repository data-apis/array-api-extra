name: CD

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
  release:
    types:
      - published

jobs:
  dist:
    name: Create dist
    runs-on: ubuntu-slim
    outputs:
      version: ${{ steps.build-inspect.outputs.package_version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - id: build-inspect
        uses: hynek/build-and-inspect-python-package@67230f7b8410ae0052b39c1efc89d89fff43ff10 # v3.0.2

  publish-pypi:
    name: Publish
    needs: [dist]
    environment: pypi
    permissions:
      id-token: write # for trusted publishing
      attestations: write # for trusted publishing
      contents: read
    runs-on: ubuntu-latest
    if: github.event_name == 'release' && github.event.action == 'published'

    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: Packages
          path: dist

      - name: Generate artifact attestation for sdist and wheel
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: "dist/*"

      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3

  conda-forge:
    name: Update conda-forge feedstock
    needs: [dist, publish-pypi]
    environment: cf
    runs-on: ubuntu-slim
    if: github.event_name == 'release' && github.event.action == 'published'
    steps:
      - name: Update conda-forge feedstock
        uses: beckermr/update-feedstock-version@92ddc557e5594b083546ec118084f6406a626ff5 # v11
        with:
          feedstock: array-api-extra-feedstock
          version: ${{ needs.dist.outputs.version }}
          github-token: ${{ secrets.XPX_CF_TOKEN }}
          automerge: false
