name: Docs

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

env:
  BUILD_EDITABLE_PYTHON: false

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  docs-build:
    name: Build
    runs-on: ubuntu-slim

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: prefix-dev/setup-pixi@9936258fee697aff89b3fed6ca1f80a382ef694e # v0.11.3
        with:
          pixi-version: v0.83.0
          cache: true
          environments: docs

      - name: Build Docs
        run: pixi run docs

      - name: Upload Artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: docs-build
          path: docs/sphinx/build/

  docs-deploy:
    name: Deploy
    if: ${{ github.ref == 'refs/heads/main' }}
    needs: docs-build
    runs-on: ubuntu-slim

    permissions:
      contents: write # needed for the deploy step

    environment:
      name: docs-deploy

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download Artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: docs-build
          path: docs/sphinx/build/

      - name: Deploy
        uses: JamesIves/github-pages-deploy-action@fa24774553152dd7873cd16ebd8d959b010c5445 # v4.9.0
        with:
          folder: docs/sphinx/build/
          ssh-key: ${{ secrets.DEPLOY_KEY }}
